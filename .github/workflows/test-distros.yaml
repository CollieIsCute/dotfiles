name: Deploy Dotfiles on Different OS

on: [push]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CHEZMOI_GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CHEZMOI_BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:
  arch:
    name: archlinux:latest
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install chezmoi and apply dotfiles
        run: |
          pacman -Syu --noconfirm sudo git chezmoi
          useradd -m dev
          echo "dev ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/dev
          sudo -H -u dev --preserve-env=CHEZMOI_GITHUB_ACCESS_TOKEN chezmoi init collieiscute --branch "$CHEZMOI_BRANCH" --apply -v

  ubuntu:
    name: ubuntu:latest
    runs-on: ubuntu-latest
    # Keep this floating on purpose to catch upstream breaking changes early; do not pin it.
    container: ubuntu:latest
    steps:
      - name: Install chezmoi and apply dotfiles
        run: |
          apt-get update
          apt-get install -y sudo git curl
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin
          echo "ubuntu ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/ubuntu
          sudo -H -u ubuntu --preserve-env=CHEZMOI_GITHUB_ACCESS_TOKEN chezmoi init collieiscute --branch "$CHEZMOI_BRANCH" --apply -v

  macos:
    name: macos:latest
    runs-on: macos-latest
    env:
      HOMEBREW_BUNDLE_NO_JOBS: "1"
    steps:
      - run: brew update && brew install chezmoi
      - name: chezmoi init dotfiles
        run: |
          chezmoi init collieiscute --branch "$CHEZMOI_BRANCH" --apply -v

  windows:
    name: windows:latest + Arch WSL 2
    runs-on: windows-latest
    steps:
      - name: Install chezmoi, bootstrap WSL 2 and apply dotfiles
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $binDir = Join-Path $env:RUNNER_TEMP "bin"
          iex "&{$(irm 'https://get.chezmoi.io/ps1')} -b '$binDir'"
          $env:PATH = "$binDir;$env:PATH"
          $chezmoi = Join-Path $binDir "chezmoi.exe"
          # Test input only; the normal entry installs WSL and creates its user.
          $env:CHEZMOI_WSL_PASSWORD = [guid]::NewGuid().ToString('N')
          Write-Output "::add-mask::$env:CHEZMOI_WSL_PASSWORD"
          "CHEZMOI_WSL_PASSWORD=$env:CHEZMOI_WSL_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $chezmoi init collieiscute --branch "$env:CHEZMOI_BRANCH" --apply -v
          if ($LASTEXITCODE -ne 0) { throw "Windows + WSL install failed." }
          node "$env:USERPROFILE/.local/share/chezmoi/tests/wsl-templates.mjs"
      - name: Verify WSL tools and repeat the same Windows entry
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          wsl --exec bash -c 'source /etc/os-release; test "$ID" = arch'
          wsl --exec bash -c 'test "$(id -u)" -ne 0 && test "$(id -un)" = "$1"' -- $env:USERNAME.ToLowerInvariant()
          wsl --exec bash -c 'sudo -k; if sudo -n true; then echo "sudo must require authentication" >&2; exit 1; fi'
          wsl --exec fish -c 'for tool in fish tmux nvim claude codex opencode; command -q $tool; or exit 1; end; test ! -d ~/.config/hypr; and test ! -d ~/.local/libexec/openwhispr'
          & "$env:RUNNER_TEMP/bin/chezmoi.exe" apply -v
