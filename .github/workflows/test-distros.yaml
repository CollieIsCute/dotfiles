name: Test Dotfiles on Different OS

on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CHEZMOI_BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:
  linux:
    name: ${{ matrix.container }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container: ["archlinux:latest", "ubuntu:26.04"]
    container:
      image: ${{ matrix.container }}
      env:
        USER: dev
        HOME: /home/dev
    steps:
      - name: Install dependencies + create dev user
        run: |
          if command -v apt-get >/dev/null; then
            apt-get -o Acquire::Retries=3 update
            DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y sudo git curl
            readonly chezmoi_version=v2.72.0
            curl -fsSL --retry 3 --output /tmp/install-chezmoi.sh \
              "https://raw.githubusercontent.com/twpayne/chezmoi/${chezmoi_version}/assets/scripts/install.sh"
            sh /tmp/install-chezmoi.sh -b /usr/local/bin -t "$chezmoi_version"
          else
            pacman -Syu --noconfirm sudo git chezmoi curl
          fi
          # Arch's setup script builds paru via makepkg, which refuses to
          # run as root — we need an unprivileged user with passwordless
          # sudo. Apt distros could run chezmoi as root but we keep this
          # uniform across the Linux matrix.
          useradd -m dev
          echo "dev ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/dev
      - name: chezmoi init dotfiles
        run: |
          sudo -u dev chezmoi init collieiscute --branch "$CHEZMOI_BRANCH" --apply -v

  macos:
    name: macos:latest
    runs-on: macos-latest
    env:
      HOMEBREW_BUNDLE_NO_JOBS: "1"
    steps:
      - run: brew install chezmoi
      - name: chezmoi init dotfiles
        run: |
          chezmoi init collieiscute --branch "$CHEZMOI_BRANCH" --apply -v
