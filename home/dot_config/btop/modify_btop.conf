{{- /* chezmoi:modify-template */ -}}
{{- $in := .chezmoi.stdin -}}
{{- $theme := ternary "Default" "noctalia" (includeTemplate "is_wsl" . | fromJson) -}}
{{- $newline := ternary "\r\n" "\n" (contains "\r\n" $in) -}}
{{- if regexMatch (printf `(?m)^[ \t]*color_theme[ \t]*=[ \t]*"%s"[ \t]*\r?$` $theme) $in -}}
{{ $in }}
{{- else if regexMatch `(?m)^[ \t]*color_theme[ \t]*=` $in -}}
{{ $in | replaceAllRegex `(?m)^([ \t]*color_theme[ \t]*=[ \t]*)[^\r\n]*(\r?)$` (printf `${1}"%s"${2}` $theme) }}
{{- else if $in -}}
{{ $in }}{{ if not (hasSuffix "\n" $in) }}{{ $newline }}{{ end }}color_theme = "{{ $theme }}"{{ $newline }}
{{- else -}}
color_theme = "{{ $theme }}"{{ $newline }}
{{- end -}}
