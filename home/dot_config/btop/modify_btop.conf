{{- /* chezmoi:modify-template */ -}}
{{- $in := .chezmoi.stdin -}}
{{- $newline := ternary "\r\n" "\n" (contains "\r\n" $in) -}}
{{- if regexMatch `(?m)^[ \t]*color_theme[ \t]*=[ \t]*"noctalia"[ \t]*\r?$` $in -}}
{{ $in }}
{{- else if regexMatch `(?m)^[ \t]*color_theme[ \t]*=` $in -}}
{{ $in | replaceAllRegex `(?m)^([ \t]*color_theme[ \t]*=[ \t]*)[^\r\n]*(\r?)$` `${1}"noctalia"${2}` }}
{{- else if $in -}}
{{ $in }}{{ if not (hasSuffix "\n" $in) }}{{ $newline }}{{ end }}color_theme = "noctalia"{{ $newline }}
{{- else -}}
color_theme = "noctalia"{{ $newline }}
{{- end -}}
