# Voxtype v0.7.5 configuration reference:
# https://github.com/peteonrails/voxtype/blob/v0.7.5/docs/CONFIGURATION.md
engine = "whisper"

[hotkey]
enabled = false

[audio]
device = "default"
sample_rate = 16000
max_duration_secs = 60

[whisper]
backend = "remote"
language = "auto"
remote_endpoint = "http://127.0.0.1:8080"
remote_model = "local-asr"
remote_timeout_secs = 60

[output]
mode = "type"
fallback_to_clipboard = true

[output.post_process]
command = "fish -c voxtype-post-process"
timeout_ms = 5000

[text]
spoken_punctuation = true
filter_filler_words = false
