# tpm bootstrap
if "test ! -d ~/.config/tmux/plugins/tpm" \
  "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm'"

# 插件定義
set -g @plugin 'smart-splits-nvim/backend-tmux'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tpm'

# Clear the previous Ctrl+Arrow resize overrides when reloading a live server.
set -gu @smart-splits_resize_left_key
set -gu @smart-splits_resize_down_key
set -gu @smart-splits_resize_up_key
set -gu @smart-splits_resize_right_key

# Arrow equivalents of the backend's Ctrl/Alt+hjkl bindings.
bind -n C-Left  if -F '#{@pane-is-vim}' 'send-keys C-Left'  'select-pane -L'
bind -n C-Down  if -F '#{@pane-is-vim}' 'send-keys C-Down'  'select-pane -D'
bind -n C-Up    if -F '#{@pane-is-vim}' 'send-keys C-Up'    'select-pane -U'
bind -n C-Right if -F '#{@pane-is-vim}' 'send-keys C-Right' 'select-pane -R'
bind -n M-Left  if -F '#{@pane-is-vim}' 'send-keys M-Left'  'resize-pane -L 3'
bind -n M-Down  if -F '#{@pane-is-vim}' 'send-keys M-Down'  'resize-pane -D 3'
bind -n M-Up    if -F '#{@pane-is-vim}' 'send-keys M-Up'    'resize-pane -U 3'
bind -n M-Right if -F '#{@pane-is-vim}' 'send-keys M-Right' 'resize-pane -R 3'

# tmux plain settings
set -g allow-rename off
set -g automatic-rename off
set -g base-index 1
set -g mouse on
set -g monitor-activity on
set -g pane-base-index 1
set -g prefix C-z
set -g renumber-windows on
unbind C-b

# clipboard (OSC 52 — works over SSH without X11 forwarding)
set -g set-clipboard on
set -g allow-passthrough on
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# color settings (true color + 24-bit RGB)
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm*:RGB'
set -as terminal-features ',tmux-256color:clipboard'
set -as terminal-features ',xterm-256color:clipboard'
set -g @noctalia_inactive_tabs_use_background off

# keybindings
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

set -g status-left ""
set -g status-left-length 100
set -g status-right '#(if [ -n "$SSH_CONNECTION" ]; then set -- $SSH_CONNECTION; printf "%%s@%%s" "$(hostname -s)" "$3"; fi)'
set -g status-right-length 100
set -g window-status-current-format '#[fg=#{s/^bg=//;s/,.*//:status-style},reverse]#[default] #{?client_prefix,#I:,}#W#F #[fg=#{s/^bg=//;s/,.*//:status-style},reverse]#[default]'
set -g window-status-format '#[fg=#{s/^bg=//;s/,.*//:status-style},reverse]#[default] #{?client_prefix,#I:,}#W#F #[fg=#{s/^bg=//;s/,.*//:status-style},reverse]#[default]'
set -g window-status-separator ""

# session persistence
set -g @continuum-restore 'on'                # 啟動時自動還原
set -g @resurrect-capture-pane-contents 'on'   # 保存 pane 可見內容
set -g @resurrect-strategy-nvim 'session'      # 還原 neovim session

run '~/.config/tmux/plugins/tpm/tpm'
source-file -q "$HOME/.config/tmux/themes/noctalia.conf"
