{{ if or (eq .chezmoi.os "darwin") (eq .chezmoi.os "windows") -}}
[".config/matugen/templates/matugen-themes"]
type = "archive"
url = "https://github.com/InioX/matugen-themes/archive/6722a8df27e179ae14ce52b8d76b6396512cd707.tar.gz"
exact = true
stripComponents = 2
{{ if eq .chezmoi.os "darwin" -}}
include = ["*/templates/btop.theme", "*/templates/ghostty", "*/templates/kitty-colors.conf", "*/templates/midnight-discord.css"]
{{ else -}}
include = ["*/templates/alacritty.toml", "*/templates/btop.theme", "*/templates/midnight-discord.css", "*/templates/opencode-colors.json"]
{{ end -}}
checksum.sha256 = "65284a68c482fa5226cb937bb7e9fc094e14eb66f2688fc8a646503300a464e3"

