filter.command = "sed"
filter.args = ["-e", "s/matugen/noctalia/g", "-e", "s/\\.dark/.default/g"]
{{ else -}}
filter.command = "powershell"
filter.args = ["-NoProfile", "-Command", "$input -replace 'matugen','noctalia' -replace '\\.dark','.default'"]
{{ end -}}
{{ end -}}

