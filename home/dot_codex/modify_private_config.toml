{{- /* chezmoi:modify-template */ -}}
{{- $in := .chezmoi.stdin -}}
{{- $newline := ternary "\r\n" "\n" (contains "\r\n" $in) -}}
{{- $lines := list -}}
{{- $inTui := false -}}
{{- $hasTui := false -}}
{{- range $line := splitList "\n" $in -}}
  {{- if regexMatch `^[ \t]*\[` $line -}}
    {{- $inTui = regexMatch `^[ \t]*\[tui\][ \t]*(#.*)?\r?$` $line -}}
  {{- end -}}
  {{- if $inTui -}}
    {{- if regexMatch `^[ \t]*\[tui\]` $line -}}
      {{- $hasTui = true -}}
      {{- $lines = append $lines $line -}}
      {{- $lines = append $lines (printf "theme = \"noctalia\"%s" (ternary "\r" "" (eq $newline "\r\n"))) -}}
    {{- else if not (regexMatch `^[ \t]*theme[ \t]*=` $line) -}}
      {{- $lines = append $lines $line -}}
    {{- end -}}
  {{- else -}}
    {{- $lines = append $lines $line -}}
  {{- end -}}
{{- end -}}
{{- $out := join "\n" $lines -}}
{{- if $hasTui -}}
{{ $out }}
{{- else -}}
{{ $out }}{{ if and $out (not (hasSuffix "\n" $out)) }}{{ $newline }}{{ end }}[tui]{{ $newline }}theme = "noctalia"{{ $newline }}
{{- end -}}
